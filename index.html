<!DOCTYPE html>
<html>
  <head>
    <title>simple intrest calculator</title>
  </head>
  <body>
    <center>
      <h1 style="color:blue;">simple intrest calculator</h1>
      <from method="post">]
          
        <input type="number"step="any" name="p" id=""placeholder="principle">
        <input type="number"step="any" name="t" id=""placeholder="time">
        <input type="number"step="any" name="r" id=""placeholder="rate">


      </from>
        {#display output#}
        {% if result % }
            <hr>
            <h3>result,</h3>
            <span>principle:{{p}}</span>
            <span>time:{{t}}</span>
            <span>rate:{{r}}</span>
            <span>
                <b></b>
            </span>



            </span>
    </center>
  </body>
</html>
